<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Django Polls{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
</head>
<body>
    <header>
        <nav>
            <a href="/" class="logo">📊 Django Polls</a>
            <ul>
                <li><a href="/">Главная</a></li>
                <li><a href="/admin/">Админка</a></li>
            </ul>
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer>
        <p>&copy; {% now "Y" %} Django Polls Tutorial</p>
    </footer>
</body>
</html>
